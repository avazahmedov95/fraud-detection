# Redis as the pipeline's in-memory feature store.
# Most keys are short-lived per-entity features; a small persistent set
# (e.g. cached receiver-age lookups) is kept via AOF.

appendonly yes
appendfsync everysec

# Evict least-recently-used keys when the cache is full.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable RDB snapshots; AOF is sufficient here.
save ""
