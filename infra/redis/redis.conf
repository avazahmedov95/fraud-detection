# The payee's side (keys that expire) and the confirmed fraud accounts (kept),
# saved across restarts by AOF.

appendonly yes
appendfsync everysec

# When full, evict the least recently used of the keys that expire anyway: the
# confirmed fraud accounts are never evicted.
maxmemory 256mb
maxmemory-policy volatile-lru

# Disable RDB snapshots; AOF is sufficient here.
save ""
