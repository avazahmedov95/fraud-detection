apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: $CLICKHOUSE_USER
      defaultDatabase: fraud
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
# NOTE: the grafana-clickhouse-datasource schema has changed across plugin
# versions. If provisioning fails, add the datasource from the Grafana UI
# instead (host: clickhouse, port: 9000, native protocol).
