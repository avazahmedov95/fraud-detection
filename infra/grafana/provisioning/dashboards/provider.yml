apiVersion: 1

providers:
  - name: fraud-dashboards
    folder: Fraud Detection
    type: file
    disableDeletion: false
    options:
      # Dashboards (phase 8) go in the json/ subfolder so this provider config
      # is not itself parsed as a dashboard.
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
