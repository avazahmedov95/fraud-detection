<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud detection — live demo</title>
<style>
:root{--bg:#fff;--panel:#fff;--panel-2:#f3f5f8;--line:#e2e7ee;--ink:#0f1b2d;--muted:#5d6b7e;
--accent:#2a64d6;--accent-soft:#e9f0fd;--alert:#b4530a;--alert-bar:#f08c2e;--alert-soft:#fff1e3;
--ok:#0f7a47;--ok-dot:#12a15f;--ok-soft:#e6f5ed;--bad:#c2372b;
--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 0 12px}
.top h1{font-size:1.2rem;margin:0}.top h1 .sub{color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip b{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--bad)}
.chip b.on{background:var(--ok-dot)}
.lang button{background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:3px 9px;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0;border-left:0}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:.82rem}
button:hover{border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.banner{background:var(--alert-soft);border:1px solid var(--alert-bar);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.gate{max-width:640px;margin:40px auto;border:1px solid var(--line);border-radius:12px;padding:24px}
.gate h2{margin:0 0 6px;font-size:1.3rem}
.gate ul{list-style:none;padding:0;margin:16px 0}
.gate li{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;padding:8px 0;border-top:1px solid var(--line)}
.gate li b{font-size:1rem}.gate li b.ok{color:var(--ok)}.gate li b.bad{color:var(--bad)}
.gate code{grid-column:2;font:.85rem var(--mono);background:var(--panel-2);border-radius:6px;padding:4px 8px;justify-self:start}
.gate .err{grid-column:2;font-size:.8rem;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:760px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel-2);border-radius:10px;padding:10px 14px}
.stat span{display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:600 1.45rem var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.stat small{color:var(--muted);font-size:.74rem}.stat.hot b{color:var(--alert)}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:1fr}}
.col{display:grid;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px 10px}
.panel-h h2{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.panel-h .grow{flex:1}
.panel-sub{margin:-4px 14px 12px;color:var(--muted);font-size:.84rem}
.note{margin:0 14px 10px;padding:8px 11px;border-radius:8px;background:var(--accent-soft);font-size:.84rem}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-weight:500;font-size:.67rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 12px 7px;white-space:nowrap}
td{padding:7px 12px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
#stream tr{cursor:pointer}#stream tr:hover td{background:var(--panel-2)}#stream tr.sel td{background:var(--accent-soft)}
#stream tr.rev td:first-child{box-shadow:inset 3px 0 var(--alert-bar)}
@media (max-width:560px){.route{display:none}}
.mono{font-family:var(--mono)}
.tag{font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}
.tag.fraud{color:var(--alert);border-color:var(--alert-bar)}
.dec{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.03em;border-radius:5px;padding:2px 7px}
.dec.ALLOW{background:var(--ok-soft);color:var(--ok)}.dec.REVIEW{background:var(--alert-soft);color:var(--alert)}
.dec.SECOND_LOOK{background:#fdf1d8;color:#8a5a00}.dec-sub{display:block;font-size:.68rem;color:#8a5a00;margin-top:2px}
.rbar{display:inline-block;vertical-align:middle;width:64px;height:5px;border-radius:3px;background:var(--panel-2);position:relative;margin-right:7px}
.rbar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}.rbar.hot i{background:var(--alert-bar)}
.scen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 14px 14px}
.scen button{text-align:left;padding:10px 12px;display:grid;gap:3px;align-content:start}
.scen button b{font-size:.88rem}.scen button span{color:var(--muted);font-size:.76rem;line-height:1.35}
.scen button.control{grid-column:1/-1}
.empty{color:var(--muted);font-size:.86rem;padding:4px 14px 16px;margin:0}
.case{padding:2px 14px 14px}
.case-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.case .amount{font:600 1.6rem var(--mono)}.case .amount small{font-size:.8rem;color:var(--muted)}
.case .route{color:var(--muted);font:.82rem var(--mono)}
.part{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.part-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.part-h span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.part-h b{font:600 .95rem var(--mono)}
.track{height:9px;border-radius:5px;background:var(--panel-2);position:relative}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--alert-bar))}
.track .cut{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.small-note{color:var(--muted);font-size:.78rem;margin:6px 0 0}
.sub-h{font-size:.8rem;font-weight:600;margin:12px 0 8px}
.why-row{margin-bottom:9px;font-size:.85rem}
.why-row .txt{display:flex;justify-content:space-between;gap:10px}.why-row .txt b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.why-row .wb{display:flex;align-items:center;gap:8px;margin-top:3px}
.why-row .wb span{flex:1;height:6px;border-radius:3px;background:var(--panel-2);position:relative}
.why-row .wb span i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--alert-bar)}
.why-row .wb em{font:normal .74rem var(--mono);color:var(--alert);width:44px;text-align:right}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rule{font-size:.76rem;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.rule.must{border-color:var(--alert-bar);color:var(--alert);background:var(--alert-soft)}
.queue{list-style:none;margin:0;padding:0}
.queue li{border-top:1px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;cursor:pointer}
.queue li:hover{background:var(--panel-2)}.queue li.sel{background:var(--accent-soft)}
.queue .amt{font:600 .95rem var(--mono)}.queue .kind{color:var(--muted);font-size:.76rem}
.queue .acts{display:flex;gap:6px;flex-wrap:wrap}.queue .acts button{padding:5px 9px;font-size:.76rem}
.count{font-family:var(--mono);color:var(--muted)}
.more{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.more:empty{display:none}
.about-intro{max-width:78ch;margin:0 0 14px}
.flow{padding:0 14px 14px;display:grid;gap:12px}
.flow-group{display:grid;gap:6px}
.flow-group h3{margin:0;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flow-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.comp{text-align:left;display:grid;gap:2px;align-content:start;padding:9px 11px;border-radius:10px}
.comp .kind{font:500 .64rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.comp .name{font-weight:600;font-size:.88rem}.comp .sub{color:var(--muted);font-size:.76rem;line-height:1.35}
.comp.store{background:var(--panel-2)}.comp.ml{border-color:var(--accent)}
.comp.on{border-color:var(--accent);background:var(--accent-soft)}
.walk{margin-top:14px}
.walk-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 14px 12px}
.walk-controls .grow{flex:1}
.walk-controls button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#walk-body{padding:0 14px 14px}
.walk-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
@media (max-width:920px){.walk-grid{grid-template-columns:1fr}}
.walk-card{background:var(--panel-2);border-radius:10px;padding:12px 14px}
.walk-card .amount{font:600 1.4rem var(--mono)}.walk-card .amount small{font-size:.8rem;color:var(--muted)}
.walk-card .route{color:var(--muted);font:.8rem var(--mono);margin-top:2px}
.walk-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0;font-size:.84rem}
.walk-card dt{color:var(--muted)}.walk-card dd{margin:0}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:2px;background:var(--line)}
.tl{position:relative;padding:6px 8px 6px 30px;cursor:pointer;border-radius:8px}
.tl:hover{background:var(--panel-2)}.tl.on{background:var(--accent-soft)}
.tl-dot{position:absolute;left:2px;top:11px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--line);transition:background .3s,border-color .3s,box-shadow .3s}
.tl.past .tl-dot{background:var(--accent-soft);border-color:var(--accent)}
.tl.on .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
@media (prefers-reduced-motion:reduce){.tl-dot{transition:none}}
.tl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.tl-head b{font-size:.9rem}.tl-where{font:.72rem var(--mono);color:var(--muted)}
.tl-ms{margin-left:auto;font:600 .82rem var(--mono)}
.tl-text{display:none;margin:4px 0 2px;font-size:.86rem;max-width:70ch}.tl.on .tl-text{display:block}
.feat-group{margin:14px 0 6px;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.feat-list{margin:0;padding-left:18px;display:grid;gap:5px;font-size:.88rem}
.feat-list code{font:.72rem var(--mono);color:var(--muted);margin-left:6px}
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:14px}
@media (max-width:920px){.about-grid{grid-template-columns:1fr}}
.model-list{margin:0;padding:0 14px 14px 32px;display:grid;gap:7px;font-size:.88rem}
.rules-table td{white-space:normal;vertical-align:top;font-size:.84rem}
.rules-table td:first-child{font-weight:600}
.role{display:inline-block;font-size:.72rem;border-radius:5px;padding:1px 6px;margin:1px 0}
.role.must{background:var(--alert-soft);color:var(--alert)}.role.name{background:var(--accent-soft);color:var(--accent)}
.role.reason{background:var(--panel-2);color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,27,45,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.modal-card{background:var(--panel);border-radius:12px;max-width:560px;width:100%;padding:18px 20px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(15,27,45,.3)}
.modal-card.wide{max-width:900px}
.filter{display:grid;gap:12px;margin-top:14px}
.filter label{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.filter input,.filter select{font:inherit;font-size:.9rem;color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);width:100%;min-width:0}
.filter .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.filter-actions{display:flex;gap:8px;flex-wrap:wrap}
button.on-filter{border-color:var(--accent);background:var(--accent-soft)}
.modal-card h3{margin:2px 0 0;font-size:1.1rem}.modal-card ul{margin:12px 0 0;padding-left:18px;display:grid;gap:6px;font-size:.9rem}
.modal-card .kind{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.modal-close{float:right}
.timing{max-width:860px;margin-bottom:14px}
.live{font-size:.7rem;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 9px}
.lead{margin:-4px 14px 12px;color:var(--muted);font-size:.88rem;max-width:70ch}
.stages{list-style:none;margin:0;padding:0;counter-reset:stage}
.stages li{counter-increment:stage;display:grid;grid-template-columns:26px minmax(0,1fr) minmax(70px,180px) 84px;gap:4px 12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.stages li::before{content:counter(stage);font:600 .78rem var(--mono);color:var(--muted)}
.stages .name{font-weight:600;font-size:.9rem}.stages .desc{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.stages .sbar{height:8px;border-radius:4px;background:var(--panel-2);position:relative}
.stages .sbar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent);min-width:2px}
.stages li.model .sbar i{background:var(--alert-bar)}
.stages .v{font:500 .88rem var(--mono);text-align:right;white-space:nowrap}
@media (max-width:560px){.stages li{grid-template-columns:22px minmax(0,1fr) 70px}.stages .sbar{display:none}}
.total{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:12px 14px;border-top:2px solid var(--ink)}
.total span{font-weight:600}.total b{font:600 1.2rem var(--mono);margin-left:auto}
.fine{color:var(--muted);font-size:.8rem;margin:0;padding:0 14px 14px;max-width:75ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 14px 14px}
.tile{background:var(--panel-2);border-radius:10px;padding:10px 14px}
.tile span{color:var(--muted);font-size:.78rem}.tile b{display:block;font:600 1.25rem var(--mono)}
.tile small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.part-title{font-size:1.05rem;margin:26px 0 4px}
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.cmp{min-width:720px}.cmp th{padding-top:10px}
.cmp td{white-space:normal;vertical-align:top;font-size:.86rem;padding:10px 12px}
.cmp td:first-child{font-weight:600;white-space:nowrap}.cmp td.ours{font-weight:600}
.cmp a{color:var(--accent)}
.frame{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.hint{color:var(--muted);margin:0 0 12px;max-width:900px;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span data-t="title"></span> <span class="sub" data-t="subtitle"></span></h1>
    <div class="chips" id="chips"></div>
    <div class="lang"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
  </header>

  <section id="gate" hidden>
    <div class="gate">
      <h2 data-t="gate_title"></h2>
      <p class="muted" data-t="gate_hint"></p>
      <ul id="gate-list"></ul>
      <p class="muted" data-t="gate_auto"></p>
    </div>
  </section>

  <div id="app" hidden>
    <nav class="tabs">
      <button type="button" data-tab="desk" data-t="tab_desk"></button>
      <button type="button" data-tab="about" data-t="tab_about"></button>
      <button type="button" data-tab="grafana" data-t="tab_grafana"></button>
      <button type="button" data-tab="results" data-t="tab_results"></button>
    </nav>
    <div id="banner" class="banner" hidden></div>

    <section id="desk">
      <div class="strip" id="strip"></div>
      <div class="grid">
        <div class="col">
          <div class="panel">
            <div class="panel-h">
              <h2 data-t="stream_title"></h2><span class="grow"></span>
              <button type="button" data-filter="stream"></button>
              <button type="button" class="primary" id="bg-btn"></button>
            </div>
            <p class="panel-sub" data-t="stream_hint"></p>
            <div class="note" id="note" hidden></div>
            <div class="tbl"><table>
              <thead><tr><th data-t="h_time"></th><th class="num" data-t="h_amount"></th><th class="route" data-t="h_route"></th><th data-t="h_risk"></th><th data-t="h_decision"></th></tr></thead>
              <tbody id="stream"></tbody>
            </table></div>
            <div class="more" id="stream-more"></div>
          </div>
          <div class="panel">
            <div class="panel-h"><h2 data-t="cases_title"></h2></div>
            <p class="panel-sub" data-t="cases_hint"></p>
            <div class="scen" id="scen"></div>
          </div>
        </div>
        <div class="col">
          <div class="panel">
            <div class="panel-h"><h2 data-t="selected_title"></h2></div>
            <div id="detail"></div>
          </div>
          <div class="panel">
            <div class="panel-h"><h2 data-t="queue_title"></h2><span class="grow"></span><span class="count" id="q-count"></span>
              <button type="button" data-filter="queue"></button></div>
            <p class="panel-sub" data-t="queue_hint"></p>
            <ul class="queue" id="queue"></ul>
            <div class="more" id="queue-more"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="about" hidden></section>

    <section id="grafana" hidden>
      <p class="hint" data-t="grafana_hint"></p>
      <p><a id="grafana-link" target="_blank" rel="noopener" data-t="grafana_open"></a></p>
      <iframe id="grafana-frame" class="frame" title="Grafana"></iframe>
    </section>

    <section id="results" hidden>
      <div class="panel timing">
        <div class="panel-h"><h2 data-t="time_title"></h2><span class="grow"></span><span class="live" data-t="live_tag"></span></div>
        <p class="lead" data-t="time_lead"></p>
        <ol class="stages" id="stages"></ol>
        <div class="total" id="total"></div>
        <p class="fine" id="time-fine"></p>
      </div>
      <div class="panel timing">
        <div class="panel-h"><h2 data-t="verdicts_title"></h2><span class="grow"></span><span class="live" data-t="live_tag"></span></div>
        <p class="lead" data-t="verdicts_hint"></p>
        <div class="tiles" id="verdicts"></div>
      </div>
      <h2 class="part-title" id="trained-title"></h2>
      <p class="hint" data-t="trained_hint"></p>
      <div class="cmp-wrap"><table class="cmp">
        <thead><tr><th data-t="c_data"></th><th data-t="c_what"></th><th data-t="c_ours"></th><th data-t="c_published"></th></tr></thead>
        <tbody id="cmp"></tbody>
      </table></div>
    </section>

    <div class="modal" id="modal" hidden><div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div></div>
  </div>
</div>

<script>
const T = {
ru: {
  title: "Обнаружение мошенничества в P2P-переводах", subtitle: "· живое демо",

const pct = v => v == null ? "—" : dec(v * 100, 1) + "%";
const fmtMs = v => v == null ? "—" : dec(v, v < 10 ? 2 : 0) + " " + t("ms");
const fmtDur = s => s == null ? "—" : s < 60 ? Math.round(s) + " " + t("sec")
  : s < 3600 ? Math.round(s / 60) + " " + t("min") : dec(s / 3600, 1) + " " + t("hour");
const fmtTime = s => s ? new Date(typeof s === "number" ? s * 1000 : Date.parse(String(s).replace(" ", "T") + "Z")).toLocaleTimeString(locale()) : "";
const kindName = k => (k && t("kind")[k]) || k || "";
const badge = d => d ? `<span class="dec ${esc(d)}">${esc(t("dec")[d] || d)}</span>` : "";
const last4 = m => "…" + String(m || "").slice(-4);

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {cache: "no-store"});
  return r.json();
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  renderScenarios(); renderStatus(); renderStream(); renderQueue(); renderDetail(); renderResults();
  renderFilterButtons();
  if (tab === "about") renderAbout();
}

function openModal(html, wide) {
  $("#modal-card").className = "modal-card" + (wide ? " wide" : "");
  $("#modal-card").innerHTML = `<button type="button" class="modal-close" data-close>${t("close")}</button>` + html;
  $("#modal").hidden = false;
  ($("#modal-card input") || $("#modal-card .modal-close")).focus();
}

function closeModal() { $("#modal").hidden = true; }

// The filter as the server reads it (server.py parse_filter); the typed times stay
// on the page only.
const filterQuery = which => Object.entries(filters[which])
  .filter(([k, v]) => v !== "" && v != null && !k.endsWith("Text"))
  .map(([k, v]) => `&${k}=${encodeURIComponent(v)}`).join("");

function filterCount(which) {
  const f = filters[which], set = k => f[k] !== "" && f[k] != null;
  return ["sender", "receiver", "decision", "type", "held"].filter(set).length
    + (set("min") || set("max") ? 1 : 0) + (set("since") || set("until") ? 1 : 0);
}

function renderFilterButtons() {
  document.querySelectorAll("[data-filter]").forEach(b => {
    const n = filterCount(b.dataset.filter);
    b.textContent = t("filter") + (n ? ` · ${n}` : "");
    b.classList.toggle("on-filter", n > 0);
  });
}

function openFilter(which) {
  const f = filters[which];
  const select = (id, label, values, name) => `<label>${label}<select id="${id}"><option value="">${t("f_all")}</option>` +
    values.map(v => `<option value="${v}">${esc(name(v))}</option>`).join("") + `</select></label>`;
  const choice = which === "stream"
    ? select("f-choice", t("f_decision"), ["ALLOW", "REVIEW", "SECOND_LOOK"], d => t("dec")[d])
    : select("f-choice", t("f_type"), [...FRAUD_KINDS, "NONE"], k => k === "NONE" ? t("type_none") : kindName(k)) +
      select("f-held", t("f_held"), ["MODEL", "RULE", "SECOND_LOOK"], k => t("held_by")[k]);
  openModal(`<h3>${t(which === "stream" ? "f_title_stream" : "f_title_queue")}</h3>
    <form class="filter" id="filter-form" data-which="${which}">
      <label>${t("f_sender")}<input id="f-sender" inputmode="numeric" placeholder="${t("f_card_hint")}" value="${esc(f.sender || "")}"></label>
      <label>${t("f_receiver")}<input id="f-receiver" inputmode="numeric" placeholder="${t("f_card_hint")}" value="${esc(f.receiver || "")}"></label>
      <div class="pair"><label>${t("f_min")}<input id="f-min" type="number" min="0" value="${esc(f.min ?? "")}"></label>
        <label>${t("f_max")}<input id="f-max" type="number" min="0" value="${esc(f.max ?? "")}"></label></div>
      <div class="pair"><label>${t("f_since")}<input id="f-since" type="time" value="${esc(f.sinceText || "")}"></label>
        <label>${t("f_until")}<input id="f-until" type="time" value="${esc(f.untilText || "")}"></label></div>
      ${choice}
      <div class="filter-actions"><button type="submit" class="primary">${t("f_apply")}</button>
        <button type="button" data-filter-reset="${which}">${t("f_reset")}</button></div>
    </form>`);
  $("#f-choice").value = (which === "stream" ? f.decision : f.type) || "";
  if (which === "queue") $("#f-held").value = f.held || "";
}

// "HH:MM" today, as epoch seconds; the end of a range takes the whole minute.
function todayAt(hhmm, end) {
  if (!hhmm) return null;
  const [h, m] = hhmm.split(":").map(Number), d = new Date();
  d.setHours(h, m, end ? 59 : 0, end ? 999 : 0);
  return d.getTime() / 1000;
}

function applyFilter(which, f) {
  filters[which] = f;
  limits[which] = PAGE;
  closeModal();
  renderFilterButtons();
  (which === "stream" ? refreshStream : refreshCases)();
}

// "Showing n of total", then "show more" while there is more and "show fewer" once
// the list has grown.
function moreBar(which, n, total) {
  if (total <= PAGE) return "";
  return `<span>${fill(t("shown_of"), {n: fmtInt(n), total: fmtInt(total)})}</span>` +
    (n < total && limits[which] < 400 ? `<button type="button" data-more="${which}">${fill(t("more"), {step: PAGE})}</button>` : "") +
    (limits[which] > PAGE ? `<button type="button" data-less="${which}">${t("less")}</button>` : "");
}

function renderStatus() {
  if (!status) return;
  const p = status.parts;
  $("#chips").innerHTML = ["kafka", "clickhouse", "job"].map(k =>
    `<span class="chip"><b class="${p[k] ? "on" : ""}"></b>${esc(t("part")[k].split(" — ")[0])}</span>`).join("") +
    (status.model ? `<span class="chip">${t("model")}: ${esc(status.model)}</span>` : "");
  $("#gate").hidden = status.ready;
  $("#app").hidden = !status.ready;
  if (!status.ready) {
    $("#gate-list").innerHTML = PARTS.map(k => `<li><b class="${p[k] ? "ok" : "bad"}">${p[k] ? "✓" : "✗"}</b>` +
      `<span>${esc(t("part")[k])}</span>` + (p[k] ? "" : `<code>${esc(t("fix")[k])}</code>`) +
      (k === "data" && !p[k] && status.data_error ? `<span class="err">${esc(status.data_error)}</span>` : "") + `</li>`).join("");
    return;
  }
  const c = status.counts || {}, total = Object.values(c).reduce((a, b) => a + b, 0);
  const st = (lastCases && lastCases.stats) || {}, done = (st.CONFIRMED_FRAUD || 0) + (st.FALSE_POSITIVE || 0);
  $("#strip").innerHTML =
    `<div class="stat"><span>${t("t_total")}</span><b>${fmtInt(total)}</b></div>` +
    `<div class="stat hot"><span>${t("t_review")}</span><b>${fmtInt(c.REVIEW || 0)}</b></div>` +
    `<div class="stat"><span>${t("t_prec")}</span><b>${st._precision == null ? "—" : Math.round(st._precision * 100) + "%"}</b>` +
    `<small>${done ? fill(t("t_prec_sub"), {a: fmtInt(st.CONFIRMED_FRAUD || 0), b: fmtInt(done)}) : t("t_prec_none")}</small></div>` +
    `<div class="stat"><span>${t("t_ms")}</span><b>${fmtMs(status.median_ms)}</b>` +
    `<small>${status.p99_ms == null ? "" : fill(t("t_ms_sub"), {p99: fmtMs(status.p99_ms)})}</small></div>`;
  $("#bg-btn").textContent = t(status.background.on ? "bg_stop" : "bg_start");
  let msg = "";
  if (runId && Date.now() - runStarted > 15000 && !(status.last_decision && status.last_decision * 1000 > runStarted)) msg = t("no_decisions");
  $("#banner").hidden = !msg; $("#banner").textContent = msg;
}

async function refreshStatus() {
  try { status = await api("/api/status"); }
  catch (e) {
    status = null;
    $("#app").hidden = true; $("#gate").hidden = false;
    $("#gate-list").innerHTML = `<li><b class="bad">✗</b><span>${esc(t("gate_down"))}</span></li>`;
    return;
  }
  renderStatus();
}

function tagFor(r) {
  if (!r.role) return "";
  if (r.role === "history") return `<span class="tag">${t("tag_history")}</span>`;
  if (r.truth && r.truth !== "NONE") return `<span class="tag fraud">${esc(fill(t("tag_case"), {kind: kindName(r.truth).toLowerCase()}))}</span>`;
  return `<span class="tag">${t("tag_control")}</span>`;
}

function renderStream() {
  if (!status || !status.ready) return;
  $("#stream").innerHTML = streamRows.length ? streamRows.map(r => {
    const hot = r.decision === "REVIEW";
    return `<tr data-row="${esc(r.id)}" class="${hot ? "rev" : ""} ${selected && selected.id === r.id ? "sel" : ""}">` +
      `<td class="mono">${esc(fmtTime(r.at))}</td><td class="num mono">${fmtInt(r.amount)}</td>` +
      `<td class="route"><span class="mono" title="${esc(r.from)} → ${esc(r.to)}">${esc(last4(r.from))} → ${esc(last4(r.to))}</span>${tagFor(r)}</td>` +
      `<td><span class="rbar ${hot ? "hot" : ""}"><i style="width:${Math.max(3, Math.min(1, r.score || 0) * 100)}%"></i></span><span class="mono">${dec(r.score, 2)}</span></td>` +
      `<td>${badge(r.decision)}${r.second ? `<small class="dec-sub">${t("second_mark")}</small>` : ""}</td></tr>`;
  }).join("") : `<tr><td colspan="5" class="muted">${t(filterCount("stream") ? "empty_filtered" : "empty_live")}</td></tr>`;
  $("#stream-more").innerHTML = moreBar("stream", streamRows.length, streamTotal);
}

async function refreshStream() {
  const r = await api(`/api/stream?limit=${limits.stream}` + filterQuery("stream"));
  streamRows = r.rows || [];
  streamTotal = r.total || 0;
  renderStream();
  if (!selected || selected.src === "stream") renderDetail();
}

function renderScenarios() {
  $("#scen").innerHTML = [...FRAUD_KINDS, "NORMAL"].map(k =>
    `<button type="button" data-play="${k}" class="${k === "NORMAL" ? "control" : ""}"><b>${esc(kindName(k))}</b><span>${esc(t("kind_desc")[k])}</span></button>`).join("");
}

async function play(kind) {
  document.querySelectorAll("[data-play]").forEach(b => b.disabled = true);
  try {
    const r = await api("/api/episode", {kind});
    if (r.error) { note(r.error); return; }
    runId = r.id; runStarted = Date.now(); runPicked = null;
    note(fill(t("sending"), {kind: kindName(kind).toLowerCase()}));
  } finally { setTimeout(() => document.querySelectorAll("[data-play]").forEach(b => b.disabled = false), 1500); }
}

function note(text) { $("#note").textContent = text; $("#note").hidden = !text; }

async function refreshRun() {
  const run = await api("/api/episode/" + runId);
  if (!run.rows) return;
  const fraud = run.rows.filter(r => r.truth !== "NONE"), normal = run.rows.filter(r => r.truth === "NONE");
  const flagged = r => r.decision === "REVIEW";
  const parts = [];
  if (fraud.length) parts.push(fill(t("caught"), {a: fraud.filter(flagged).length, b: fraud.length}));
  if (normal.length) parts.push(fill(t("false_alarms"), {a: normal.filter(flagged).length, b: normal.length}));
  note(`${kindName(run.kind)}: ${parts.join("; ")}.` + (run.error ? ` ${run.error}` : ""));
  // The run's last alert on a fraudulent row opens by itself, once.
  const hit = [...fraud].reverse().find(flagged);
  if (hit && runPicked !== hit.id) { runPicked = hit.id; selected = {src: "stream", id: hit.id}; renderStream(); renderDetail(); }
  if (run.rows.every(r => r.decision && r.decision !== "SECOND_LOOK")) runId = null;
}

function whyBlock(why) {
  if (!why) return "";
  if (!why.items || !why.items.length) {
    const s = t("why_status")[why.status];
    return s ? `<p class="small-note">${esc(s)}</p>` : "";
  }
  const max = Math.max(...why.items.map(i => i.weight), 0.01);
  return `<div class="sub-h">${t("why")}</div>` + why.items.map(i => {
    const label = lang === "ru" ? (T.ru.feat[i.feature] || i.label_en) : i.label_en;
    const shown = lang === "ru" ? String(i.shown).replace(/\byes\b/g, "да").replace(/\bno\b/g, "нет")
      .replace(" days", " дн.").replace(" min", " мин").replace(" sigma", " σ").replace(" UZS", " сум") : i.shown;
    return `<div class="why-row"><div class="txt"><span>${esc(label)}</span><b>${esc(shown)}</b></div>` +
      `<div class="wb"><span><i style="width:${Math.round(100 * Math.max(0, i.weight) / max)}%"></i></span><em>+${dec(i.weight, 2)}</em></div></div>`;
  }).join("");
}

// One model's risk against its own line.
function riskPart(title, score, cut, note) {
  return `<div class="part-h"><span>${title}</span><b>${t("risk")} ${dec(score, 2)}</b></div>
      <div class="track"><i style="width:${Math.max(2, Math.min(1, score || 0) * 100)}%"></i>${cut == null ? "" : `<span class="cut" style="left:${cut * 100}%"></span>`}</div>
      ${cut == null ? "" : `<p class="small-note">${fill(note, {cut: dec(cut, 2)})}</p>`}`;
}

function renderDetail() {
  if (!status || !status.ready) return;
  const pool = selected && selected.src === "case" ? ((lastCases && lastCases.cases) || []) : streamRows;
  // The last copy seen stays on screen once newer rows push this one off the list.
  const fresh = selected && pool.find(r => r.id === selected.id);
  if (fresh) selected.row = fresh;
  const x = selected && selected.row;
  if (!x) { $("#detail").innerHTML = `<p class="empty">${t("pick")}</p>`; return; }
  const rules = x.rules || [];
  let rnote = "";
  if (rules.some(r => MUST.has(r))) rnote = t("note_must");
  else if (rules.length) rnote = x.type ? fill(t("note_named"), {type: kindName(x.type).toLowerCase()}) : t("note_reasons");
  else if (x.decision === "REVIEW") rnote = t("note_model_only");
  // Just under the alert level, the model sends the transfer to the second look.
  const sent = x.decision === "SECOND_LOOK" ? t("note_waiting") : x.second ? t("note_sent") : "";
  $("#detail").innerHTML = `<div class="case">
    <div class="case-top"><span class="amount">${fmtInt(x.amount)} <small>${t("sum")}</small></span>${badge(x.decision)}</div>
    <div class="route">${esc(x.from)} → ${esc(x.to)}</div>
    <div class="part">
      ${riskPart(t("part_model"), x.score, status.cut, t("cut_note"))}
      ${sent ? `<p class="small-note">${sent}</p>` : ""}
      ${x.decision === "ALLOW" && !x.second ? `<p class="small-note">${t("note_allowed")}</p>` : whyBlock(x.why)}
    </div>
    ${x.second ? `<div class="part">
      ${riskPart(t("part_second"), x.second_score, status.second_cut, t("second_note"))}
      ${x.second_score == null ? `<p class="small-note">${t("note_unscored")}</p>` : ""}
    </div>` : ""}
    <div class="part">
      <div class="part-h"><span>${t("part_rules")}</span><b>${fill(t("rules_fired"), {n: rules.length})}</b></div>
      ${rules.length ? `<div class="rules">${rules.map(r => `<span class="rule ${MUST.has(r) ? "must" : ""}" title="${esc(r)}">${esc(t("rules")[r] || r)}</span>`).join("")}</div>` : ""}
      ${rnote ? `<p class="small-note">${rnote}</p>` : ""}
    </div></div>`;
}

function renderQueue() {
  if (!lastCases) return;
  if (lastCases.error) { $("#queue").innerHTML = `<p class="empty">${esc(t("no_store") + lastCases.error)}</p>`; return; }
  const cs = lastCases.cases;
  $("#q-count").textContent = fmtInt(lastCases.total);
  $("#queue-more").innerHTML = moreBar("queue", cs.length, lastCases.total);
  $("#queue").innerHTML = cs.length ? cs.map(c => `<li data-case="${esc(c.id)}" class="${selected && selected.id === c.id ? "sel" : ""}">` +
    `<div><div class="amt">${fmtInt(c.amount)} ${t("sum")}</div><div class="kind">${esc(c.type ? kindName(c.type) : t("type_none"))} · ${t("risk")} ${dec(c.score, 2)}${c.second ? " · " + t("second_mark") : ""} · ${fill(t("held"), {t: fmtDur(c.held_s)})}</div></div>` +
    `<div class="acts"><button type="button" class="primary" data-res="CONFIRMED_FRAUD">${t("confirm")}</button>` +
    `<button type="button" data-res="FALSE_POSITIVE">${t("fp")}</button></div></li>`).join("")
    : `<p class="empty">${t(filterCount("queue") ? "empty_filtered" : "empty_cases")}</p>`;
}

async function refreshCases() {
  lastCases = await api(`/api/cases?new=1&limit=${limits.queue}` + filterQuery("queue"));
  renderQueue(); renderStatus();
  if (selected && selected.src === "case") renderDetail();
}

function showGrafana() {
  const url = status && status.grafana;
  $("#grafana-link").href = url || "#";
  if (url && !$("#grafana-frame").getAttribute("src")) $("#grafana-frame").src = url;
}

let live = null;
async function refreshLive() { live = await api("/api/live"); renderLive(); }

function renderLive() {
  if (!live) return;
  const tm = live.timing || {};
  if (tm.error) { $("#stages").innerHTML = ""; $("#total").innerHTML = ""; $("#time-fine").textContent = tm.error; }
  else {
    const scale = tm.total_ms || 1;
    $("#stages").innerHTML = (tm.stages || []).map(s => {
      const [name, desc] = t("stage")[s.name] || [s.name, ""];
      return `<li class="${s.name === "model" ? "model" : ""}"><span class="name">${esc(name)}<span class="desc">${esc(desc)}</span></span>` +
        `<span class="sbar">${s.ms == null ? "" : `<i style="width:${100 * s.ms / scale}%"></i>`}</span><span class="v">${fmtMs(s.ms)}</span></li>`;
    }).join("");
    $("#total").innerHTML = `<span>${t("total_avg")}</span><b>${fmtMs(tm.total_ms)}</b>`;
    $("#time-fine").textContent = tm.n ? fill(t("time_fine"), {n: fmtInt(tm.n), median: fmtMs(tm.median_ms), p99: fmtMs(tm.p99_ms)}) : t("time_empty");
  }
  const v = live.verdicts || {}, h = live.holds || {};
  const held = h.NEW || {}, kept = h.CONFIRMED_FRAUD || {}, freed = h.FALSE_POSITIVE || {};
  $("#verdicts").innerHTML = [
    ["v_open", fmtInt(v.NEW || 0), held.n ? fill(t("v_open_sub"), {t: fmtDur(held.max_s)}) : ""],
    ["v_conf", fmtInt(v.CONFIRMED_FRAUD || 0), kept.n ? fill(t("v_conf_sub"), {amount: fmtInt(kept.amount)}) : ""],
    ["v_fp", fmtInt(v.FALSE_POSITIVE || 0),
     freed.n ? fill(t("v_fp_sub"), {median: fmtDur(freed.median_s), max: fmtDur(freed.max_s)}) : ""],
    ["v_prec", v._precision == null ? "—" : pct(v._precision), ""]]
    .map(([k, val, sub]) => `<div class="tile"><span>${t(k)}</span><b>${val}</b>` +
      `${sub ? `<small>${esc(sub)}</small>` : ""}</div>`).join("");
}

// What the second look adds on the same data, as results.json quotes it.
const secondLine = d => d.second ? `<br><small>${esc(d.second[lang])}</small>` : "";

function renderResults() {
  renderLive();
  if (!results) return;
  const o = results.own || {};
  const date = o.trained_at ? new Date(o.trained_at).toLocaleDateString(locale(), {day: "numeric", month: "long", year: "numeric"}) : "—";
  $("#trained-title").textContent = fill(t("trained_title"), {date});
  const own = o.error ? `<tr><td>${t("own_name")}</td><td colspan="3">${esc(o.error)}</td></tr>`
    : `<tr><td>${t("own_name")}</td>` +
      `<td>${fill(t("own_what"), {rows: fmtInt(o.rows), share: dec(o.fraud_share * 100, 2) + "%", types: o.types, test: fmtInt(o.test), tf: fmtInt(o.test_fraud)})}</td>` +
      `<td class="ours">${fill(t("own_ours"), {rec: pct(o.recall), prec: pct(o.precision), prauc: dec(o.pr_auc, 3)})}${secondLine(o)}</td>` +
      `<td>${t("own_published")}</td></tr>`;
  $("#cmp").innerHTML = own + (results.public || []).map(d => `<tr><td>${esc(d.name[lang])}</td>` +
    `<td>${esc(d.what[lang])}</td><td class="ours">${esc(d.ours[lang])}${secondLine(d)}</td>` +
    `<td>${esc(d.published[lang])}<br><a href="${esc(d.link.url)}" target="_blank" rel="noopener">${esc(d.link.label)}</a></td></tr>`).join("");
}

async function openTab(name) {
  tab = name;
  document.querySelectorAll("#app section").forEach(s => s.hidden = s.id !== tab);
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "grafana") showGrafana();
  if (tab === "results" || tab === "about") {
    if (!results) results = await api("/api/results");
    if (tab === "results") { renderResults(); refreshLive(); } else renderAbout();
  }
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-tab],[data-lang],[data-play],[data-row],[data-res],[data-case],[data-more],[data-less],[data-filter],[data-filter-reset],[data-close],#modal,#bg-btn");
  if (!el) return;
  if (el.id === "modal") { if (e.target === el) closeModal(); }
  else if (el.hasAttribute("data-close")) closeModal();
  else if (el.dataset.filter) openFilter(el.dataset.filter);
  else if (el.dataset.filterReset) applyFilter(el.dataset.filterReset, {});
  else if (el.dataset.tab) openTab(el.dataset.tab);
  else if (el.dataset.lang) { lang = el.dataset.lang; try { localStorage.setItem("demo-lang", lang); } catch (err) {} applyLang(); }
  else if (el.dataset.play) play(el.dataset.play);
  else if (el.dataset.more || el.dataset.less) {
    const which = el.dataset.more || el.dataset.less;
    limits[which] = el.dataset.more ? limits[which] + PAGE : PAGE;
    (which === "stream" ? refreshStream : refreshCases)();
  }
  else if (el.dataset.row) { selected = {src: "stream", id: el.dataset.row}; renderStream(); renderQueue(); renderDetail(); }
  else if (el.dataset.res) {
    const li = el.closest("[data-case]");
    el.disabled = true;
    await api(`/api/cases/${encodeURIComponent(li.dataset.case)}/resolve`, {disposition: el.dataset.res});
    if (selected && selected.id === li.dataset.case) selected = null;
    refreshCases();
  }
  else if (el.dataset.case) { selected = {src: "case", id: el.dataset.case}; renderStream(); renderQueue(); renderDetail(); }
  else if (el.id === "bg-btn") {
    await api("/api/background", {on: !(status && status.background.on)});
    refreshStatus();
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "filter-form") return;
  e.preventDefault();
  const which = e.target.dataset.which, v = id => $(id).value.trim();
  applyFilter(which, {sender: v("#f-sender"), receiver: v("#f-receiver"), min: v("#f-min"), max: v("#f-max"),
    since: todayAt(v("#f-since")), until: todayAt(v("#f-until"), true), sinceText: v("#f-since"), untilText: v("#f-until"),
    [which === "stream" ? "decision" : "type"]: v("#f-choice"), ...(which === "queue" ? {held: v("#f-held")} : {})});
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

document.querySelector('[data-tab="desk"]').classList.add("on");
applyLang();
const ready = () => status && status.ready;
async function tick() {
  await refreshStatus();
  if (ready() && tab === "desk") refreshStream().catch(() => {});
}
tick(); refreshCases().catch(() => {});
setInterval(tick, 1000);
setInterval(() => { if (ready() && tab === "desk") refreshCases().catch(() => {}); }, 3000);
setInterval(() => { if (ready() && runId) refreshRun().catch(() => {}); }, 700);
setInterval(() => { if (ready() && tab === "results") refreshLive().catch(() => {}); }, 5000);
</script>
