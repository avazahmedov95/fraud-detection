<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud detection — presentation</title>
<style>
:root{--bg:#fff;--panel:#fff;--panel-2:#f3f5f8;--line:#e2e7ee;--ink:#0f1b2d;--muted:#5d6b7e;
--accent:#2a64d6;--accent-soft:#e9f0fd;--alert:#b4530a;--alert-bar:#f08c2e;--alert-soft:#fff1e3;
--ok:#0f7a47;--ok-dot:#12a15f;--ok-soft:#e6f5ed;--bad:#c2372b;
--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 0 10px}
h1{font-size:1.35rem;margin:0}h1 .sub{color:var(--muted);font-weight:400}
.right{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-left:auto}
.chip{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.chip b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--bad)}.chip b.on{background:var(--ok-dot)}
.lang button{background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:3px 9px;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;border-radius:0}
.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0;border-left:0}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
a.full{color:var(--accent);font-size:.88rem;text-decoration:none}a.full:hover{text-decoration:underline}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);padding:10px 14px;font-size:1rem;font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.88rem}
button:hover{border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}
.gate{max-width:640px;margin:40px auto;border:1px solid var(--line);border-radius:12px;padding:24px}
.gate h2{margin:0 0 6px;font-size:1.3rem}
.gate ul{list-style:none;padding:0;margin:16px 0}
.gate li{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;padding:8px 0;border-top:1px solid var(--line)}
.gate li b.ok{color:var(--ok)}.gate li b.bad{color:var(--bad)}
.gate code{grid-column:2;font:.85rem var(--mono);background:var(--panel-2);border-radius:6px;padding:4px 8px;justify-self:start}
.gate .err{grid-column:2;font-size:.8rem;color:var(--muted)}
.ready{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px}
.ready .lbl{font-weight:600}.ready .all{color:var(--ok);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel-2);border-radius:12px;padding:12px 16px;min-width:0}
.kpi span{display:block;font-size:.82rem;color:var(--muted)}
.kpi b{display:block;font:600 2rem/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{display:block;color:var(--muted);font-size:.8rem}
.kpi.hot b{color:var(--alert)}.kpi.good b{color:var(--ok)}
.fine{color:var(--muted);font-size:.8rem;margin:6px 0 14px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
@media (max-width:960px){.stage{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.panel h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.intro{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;padding:8px 10px;border-radius:10px}
.steps .n{grid-row:span 3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 .85rem var(--mono);background:var(--panel-2);color:var(--muted)}
.steps li b{font-size:1.02rem}
.steps li p{margin:0;font-size:.95rem;display:none}
.steps li.on{background:var(--accent-soft)}.steps li.on .n{background:var(--accent);color:#fff}.steps li.on p{display:block}
.steps li.done .n{background:var(--ok-soft);color:var(--ok)}.steps li.done b{color:var(--muted)}
.steps li p.res{display:block;color:var(--ok);font-weight:600}
.note{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--panel-2);font-size:.92rem}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.acts button{font-size:1rem;padding:10px 18px}
.tx{list-style:none;margin:0;padding:0}
.tx li{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto 7.5em;gap:4px 12px;align-items:baseline;padding:7px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tx li[data-focus]{cursor:pointer}.tx li[data-focus]:hover{background:var(--panel-2)}.tx li.sel{background:var(--accent-soft)}
.tx .lead{color:var(--muted);font-size:.85rem}.tx .route{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font:600 1rem var(--mono);text-align:right;white-space:nowrap}
@media (max-width:560px){.tx li{grid-template-columns:3em minmax(0,1fr) 6.5em}.tx .route{display:none}}
.dec{display:inline-block;font-size:.74rem;font-weight:600;letter-spacing:.03em;border-radius:5px;padding:2px 8px}
.dec.ALLOW{background:var(--ok-soft);color:var(--ok)}.dec.REVIEW{background:var(--alert-soft);color:var(--alert)}
.dec.SECOND_LOOK{background:#fdf1d8;color:#8a5a00}
.card{margin-top:14px;background:var(--panel-2);border-radius:12px;padding:14px 16px}
.card-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.card .amount{font:600 1.7rem var(--mono)}.card .amount small{font-size:.85rem;color:var(--muted)}
.card .route{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.part-h{display:flex;justify-content:space-between;gap:10px;margin:12px 0 6px;font-size:.88rem}
.part-h b{font-family:var(--mono)}
.track{height:10px;border-radius:5px;background:#fff;position:relative}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--alert-bar))}
.track .cut{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.small-note{color:var(--muted);font-size:.8rem;margin:5px 0 0}
.sub-h{font-size:.88rem;font-weight:600;margin:14px 0 6px}
.why-row{margin-bottom:8px;font-size:.92rem}
.why-row .txt{display:flex;justify-content:space-between;gap:10px}.why-row .txt b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.why-row .wb{height:6px;border-radius:3px;background:#fff;position:relative;margin-top:3px}
.why-row .wb i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--alert-bar)}
.rules,.mem{display:flex;flex-wrap:wrap;gap:6px}
.rule,.mem span{font-size:.82rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.mem span.hit{border-color:var(--alert-bar);color:var(--alert);background:var(--alert-soft);font-weight:600}
.empty{color:var(--muted);margin:4px 0}
.flowp{margin-top:14px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.flow li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:relative;transition:background .3s,border-color .3s}
.flow li b{display:block;font-size:.92rem}.flow li span{display:block;font-size:.78rem;color:var(--muted);line-height:1.35}
.flow li.on{border-color:var(--accent);background:var(--accent-soft)}
.flow li:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
@media (max-width:1000px){.flow li::after{display:none}}
@media (prefers-reduced-motion:reduce){.flow li{transition:none}}
.lead{max-width:84ch;margin:0 0 16px}
.heads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1000px){.heads{grid-template-columns:repeat(2,minmax(0,1fr))}}
.head{background:var(--panel-2);border-radius:12px;padding:12px 16px;min-width:0}
.head span{display:block;font-size:.84rem;color:var(--muted)}
.head b{display:block;font:600 1.6rem var(--mono);margin-top:4px}.head b em{font-style:normal;font-weight:400;color:var(--muted);margin:0 8px}
.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:960px){.tables{grid-template-columns:1fr}}
.rt{border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.rt h3{margin:0 0 4px;font-size:1.05rem}.rt p{margin:0 0 10px;color:var(--muted);font-size:.88rem}
.rt .tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:right;font-weight:500;font-size:.76rem;color:var(--muted);padding:0 8px 6px;vertical-align:bottom}
td{padding:7px 8px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{text-align:left;font-family:inherit;white-space:normal}
tr.now td{font-weight:600}tr.was td{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span data-t="title"></span> <span class="sub" data-t="subtitle"></span></h1>
    <div class="right">
      <span class="chip" id="sys"></span>
      <div class="lang"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
      <a class="full" href="/" data-t="full"></a>
    </div>
  </header>

  <section id="gate" hidden>
    <div class="gate">
      <h2 data-t="gate_title"></h2>
      <p class="muted" data-t="gate_hint"></p>
      <ul id="gate-list"></ul>
      <p class="muted" data-t="gate_auto"></p>
    </div>
  </section>

  <div id="app" hidden>
    <nav class="tabs">
      <button type="button" data-tab="live" data-t="tab_live"></button>
      <button type="button" data-tab="research" data-t="tab_research"></button>
    </nav>

    <section id="live">
      <div class="ready" id="ready"></div>
      <div class="kpis" id="kpis"></div>
      <p class="fine" data-t="k_note"></p>
      <div class="stage">
        <div class="panel">
          <h2 data-t="story_title"></h2>
          <p class="intro" data-t="story_intro"></p>
          <ol class="steps" id="steps"></ol>
          <div class="note" id="story-note" hidden></div>
          <div class="acts" id="story-acts"></div>
        </div>
        <div class="panel">
          <h2 id="scene-title"></h2>
          <div id="scene"></div>
        </div>
      </div>
      <div class="panel flowp">
        <h2 data-t="flow_title"></h2>
        <ol class="flow" id="flow"></ol>
      </div>
    </section>

    <section id="research" hidden>
      <p class="lead" data-t="r_intro"></p>
      <div class="heads" id="heads"></div>
      <div class="tables" id="tables"></div>
      <p class="fine" id="r-source"></p>
    </section>
  </div>
</div>

<script>
const T = {
ru: {
  title: "Обнаружение мошенничества в P2P-переводах", subtitle: "· показ",

  k_stopped: "Остановлено мошенничества", k_stopped_sub: "{amount} сум остались у клиентов", k_stopped_none: "аналитик ещё не блокировал",

  flow_title: "Как устроена система",
  flow: [["Перевод", "приходит в очередь Kafka"], ["История", "что делали отправитель и получатель: Flink, Redis"],

  h_recall: "Поймано мошенничества", h_f1: "F1", h_speed: "Время решения при 50 переводах в секунду",

  why_status: {NO_MODEL: "файл модели для объяснений не найден", MODEL_MISMATCH: "модель объяснений не совпадает с рабочей — объяснение не показано", NO_FEATURES: "решение принято без признаков модели", FAILED: "объяснение не удалось посчитать"},

    VELOCITY: "много переводов за 10 минут", STRUCTURING: "суммы чуть ниже порога отчётности",
    DISTINCT_PAYEE_BURST: "много разных получателей за 10 минут",
    GEO_ANOMALY: "необычный регион", IMPOSSIBLE_TRAVEL: "невозможное перемещение",
    AMOUNT_DEVIATION: "сумма намного выше обычной", COACHED_SESSION: "идёт звонок, долгое подтверждение",

  feat: {log_amount: "сумма", amount_to_mean: "сумма к средней у отправителя", amount_z: "сумма к обычному разбросу",
    is_new_payee: "получатель новый", vel_10m: "переводов за 10 минут", vel_1h: "переводов за час",

const PARTS = ["kafka", "clickhouse", "job", "data"];
// The parts of the system each step of the story passes through (T.flow).
const LIT = [[], [0, 1, 2, 3, 4], [0, 1, 2, 4], [4], [5], [6, 1, 2, 4]];

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let lang = "ru", tab = "live", status, cases = null, research = null, ticker = [], rate = null, prev = null;
const story = {step: 0, runId: null, run: null, sent: 0, held: null, follow: null, focus: null,
  blocked: false, busy: false, note: "", passed: ""};
try { lang = localStorage.getItem("demo-lang") || "ru"; } catch (e) {}
const t = k => T[lang][k] ?? T.en[k] ?? k;
const fill = (s, vals) => Object.entries(vals).reduce((a, [k, v]) => a.replace(`{${k}}`, v), s);
const locale = () => lang === "ru" ? "ru-RU" : "en-GB";
const fmtInt = n => Number(n || 0).toLocaleString(locale());
const dec = (v, d) => v == null ? "—" : Number(v).toFixed(d).replace(".", lang === "ru" ? "," : ".");
const fmtMs = v => v == null ? "—" : dec(v, v < 10 ? 1 : 0) + " " + t("ms");
const fmtTime = s => s ? new Date(s * 1000).toLocaleTimeString(locale()) : "";
// A figure as the documents write it ("2,000", "98.3%"), in the page's language.
const local = v => v == null ? "—" : lang === "ru" ? String(v).replace(/,/g, "\u202f").replace(/\./g, ",") : String(v);
const badge = d => d ? `<span class="dec ${esc(d)}">${esc(t("dec")[d] || d)}</span>` : `<span class="muted">…</span>`;
const last4 = m => "…" + String(m || "").slice(-4);
const ready = () => status && status.ready;
const streaming = () => ready() && status.background.on && status.last_decision && Date.now() / 1000 - status.last_decision < 5;

// What each block shows, so that a refresh with nothing new leaves the DOM (and a
// button about to be clicked) alone.
const shown = new Map();
function put(sel, html) { if (shown.get(sel) !== html) { shown.set(sel, html); $(sel).innerHTML = html; } }

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {cache: "no-store"});
  return r.json();
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  shown.clear();
  renderStatus(); renderStory(); renderScene(); renderFlow(); renderResearch();
}

function renderStatus() {
  if (status === undefined) return;                 // not asked yet
  $("#sys").innerHTML = `<b class="${ready() ? "on" : ""}"></b>${t(ready() ? "sys_on" : "sys_off")}`;
  $("#gate").hidden = ready(); $("#app").hidden = !ready();
  if (!status) { put("#gate-list", `<li><b class="bad">✗</b><span>${esc(t("gate_down"))}</span></li>`); return; }
  if (!status.ready) {
    const p = status.parts;
    put("#gate-list", PARTS.map(k => `<li><b class="${p[k] ? "ok" : "bad"}">${p[k] ? "✓" : "✗"}</b><span>${esc(t("part")[k])}</span>` +
      (p[k] ? "" : `<code>${esc(t("fix")[k])}</code>`) +
      (k === "data" && !p[k] && status.data_error ? `<span class="err">${esc(status.data_error)}</span>` : "") + `</li>`).join(""));
    return;
  }
  const items = [["r_system", true], ["r_second", status.second_look], ["r_stream", streaming()]];
  put("#ready", `<span class="lbl">${t("ready")}</span>` +
    items.map(([k, ok]) => `<span class="chip"><b class="${ok ? "on" : ""}"></b>${t(k)}</span>`).join("") +
    (items.every(([, ok]) => ok) ? `<span class="all">${t("all_ready")}</span>` : "") +
    `<button type="button" id="bg" class="${status.background.on ? "" : "primary"}">${t(status.background.on ? "stop" : "prepare")}</button>`);
  renderKpis();
}

function renderKpis() {
  const c = status.counts || {}, total = Object.values(c).reduce((a, b) => a + b, 0), held = c.REVIEW || 0;
  const st = (cases && cases.stats) || {}, kept = ((cases && cases.holds) || {}).CONFIRMED_FRAUD || {};
  put("#kpis", [
    ["", "k_total", fmtInt(total), t("k_total_sub")],
    ["hot", "k_held", fmtInt(held), total ? fill(t("k_held_sub"), {p: dec(100 * held / total, 1) + "%"}) : ""],
    ["good", "k_stopped", fmtInt(st.CONFIRMED_FRAUD), kept.n ? fill(t("k_stopped_sub"), {amount: fmtInt(kept.amount)}) : t("k_stopped_none")],
    ["", "k_fp", fmtInt(st.FALSE_POSITIVE), t("k_fp_sub")],
    ["", "k_ms", fmtMs(status.median_ms), status.p99_ms == null ? "" : fill(t("k_ms_sub"), {p99: fmtMs(status.p99_ms)})]]
    .map(([cls, k, v, sub]) => `<div class="kpi ${cls}"><span>${t(k)}</span><b>${v}</b><small>${esc(sub)}</small></div>`).join(""));
}

// The mule: the card most of the case's transfers go to.
function mule() {
  const n = {};
  ((story.run && story.run.rows) || []).forEach(r => n[r.to] = (n[r.to] || 0) + 1);
  return Object.keys(n).sort((a, b) => n[b] - n[a])[0] || "";
}

// The step 5 outcome, from what the job read for that transfer.
function followText(row) {
  const m = row.marks || {}, out = row.from === mule(), seen = out ? m.sender : m.payee;
  if (row.decision === "REVIEW") return t(seen ? (out ? "res_sender" : "res_payee") : "res_held");
  return t(seen ? "res_mark_allowed" : "res_allowed");
}

function renderStory() {
  if (!ready()) return;
  const s = story.step, vals = {rate: rate == null ? "—" : dec(rate, 0), median: fmtMs(status.median_ms),
    card: mule(), ms: fmtMs(story.held && story.held.ms)};
  put("#steps", t("steps").map(([title, text], k) => {
    const i = k + 1;
    const res = i === 2 && s > 2 ? story.passed
      : i === 4 && story.blocked ? fill(t("st_blocked"), {amount: fmtInt(story.held.amount), card: mule()})
      : i === 5 && story.follow ? followText(story.follow) : "";
    return `<li class="${i === s ? "on" : i < s ? "done" : ""}"><span class="n">${i < s ? "✓" : i}</span>` +
      `<b>${esc(title)}</b><p>${esc(fill(i === 3 && story.held && story.held.second ? t("step3_second") : text, vals))}</p>${res ? `<p class="res">${esc(res)}</p>` : ""}</li>`;
  }).join(""));
  $("#story-note").hidden = !story.note;
  $("#story-note").textContent = story.note;
  const b = (k, act) => `<button type="button" class="primary" data-act="${act}"${story.busy ? " disabled" : ""}>${t(k)}</button>`;
  put("#story-acts", [b("b_start", 1), b("b_case", 2), story.note && !story.busy ? b("b_again", 2) : "",
    b("b_analyst", 4), story.blocked ? b("b_next", 5) : b("b_block", "block"), b("b_again", 2)][s]);
}

function whyBlock(why) {
  if (!why) return "";
  if (!why.items || !why.items.length) {
    const s = t("why_status")[why.status];
    return s ? `<p class="small-note">${esc(s)}</p>` : "";
  }
  const max = Math.max(...why.items.map(i => i.weight), 0.01);
  return `<div class="sub-h">${t("why")}</div>` + why.items.map(i => {
    const label = lang === "ru" ? (T.ru.feat[i.feature] || i.label_en) : i.label_en;
    const shown = lang === "ru" ? String(i.shown).replace(/\byes\b/g, "да").replace(/\bno\b/g, "нет")
      .replace(" days", " дн.").replace(" min", " мин").replace(" sigma", " σ").replace(" UZS", " сум") : i.shown;
    return `<div class="why-row"><div class="txt"><span>${esc(label)}</span><b>${esc(shown)}</b></div>` +
      `<div class="wb"><i style="width:${Math.round(100 * Math.max(0, i.weight) / max)}%"></i></div></div>`;
  }).join("");
}

// One model's risk against its own line.
function track(title, score, cut, note) {
  return `<div class="part-h"><span>${title}</span><b>${dec(score, 2)}</b></div>
    <div class="track"><i style="width:${Math.max(2, Math.min(1, score || 0) * 100)}%"></i>${cut == null ? "" : `<span class="cut" style="left:${cut * 100}%"></span>`}</div>
    ${cut == null ? "" : `<p class="small-note">${fill(note, {cut: dec(cut, 2)})}</p>`}`;
}

function detail(x) {
  const m = x.marks, rules = x.rules || [];
  return `<div class="card">
    <div class="card-top"><span class="amount">${fmtInt(x.amount)} <small>${t("sum")}</small></span>${badge(x.decision)}
      <span class="muted">${x.ms == null || x.second ? "" : fill(t("ms_dec"), {ms: fmtMs(x.ms)})}</span></div>
    <div class="route mono">${esc(x.from)} → ${esc(x.to)}</div>
    ${track(t("risk"), x.score, status.cut, t("line"))}
    ${x.second ? track(t("second"), x.second_score, status.second_cut, t("second_line")) : ""}
    ${x.decision === "ALLOW" ? "" : whyBlock(x.why)}
    <div class="sub-h">${t("rules_h")}</div><div class="rules">${rules.length
      ? rules.map(r => `<span class="rule">${esc(t("rule")[r] || r)}</span>`).join("") : `<span class="muted">${t("no_rules")}</span>`}</div>
    ${m ? `<div class="sub-h">${t("memory")}</div><div class="mem">` +
      `<span class="${m.payee ? "hit" : ""}">${t("mem_payee")}: ${t(m.payee ? "yes" : "no")}</span>` +
      `<span class="${m.sender ? "hit" : ""}">${t("mem_sender")}: ${t(m.sender ? "yes" : "no")}</span></div>` : ""}
  </div>`;
}

function txRow(r, k, sel) {
  return `<li class="${sel ? "sel" : ""}"${k == null ? "" : ` data-focus="${esc(r.id)}"`}>` +
    `<span class="lead${k == null ? " mono" : ""}">${esc(k == null ? fmtTime(r.at) : "№" + (k + 1))}</span>` +
    `<span class="route mono">${esc(last4(r.from))} → ${esc(last4(r.to))}</span>` +
    `<span class="amt">${fmtInt(r.amount)} ${t("sum")}</span><span>${badge(r.decision)}</span></li>`;
}

function renderScene() {
  if (!ready()) return;
  const onCase = story.step >= 2 && story.run;
  $("#scene-title").textContent = t(onCase ? "scene_case" : "scene_stream");
  if (!onCase) {
    put("#scene", ticker.length ? `<ul class="tx">${ticker.map(r => txRow(r)).join("")}</ul>`
      : `<p class="empty">${t("empty_stream")}</p>`);
    return;
  }
  const rows = story.run.rows.filter(r => r.sent);
  const focus = rows.find(r => r.id === story.focus) || rows[rows.length - 1];
  put("#scene", `<ul class="tx">${rows.map((r, k) => txRow(r, k, focus && r.id === focus.id)).join("")}</ul>` +
    (focus && focus.decision ? detail(focus) : ""));
}

function renderFlow() {
  const lit = new Set(LIT[story.step]);
  put("#flow", t("flow").map(([b, s], i) => `<li class="${lit.has(i) ? "on" : ""}"><b>${esc(b)}</b><span>${esc(s)}</span></li>`).join(""));
}

function renderResearch() {
  if (!research || !research.length) return;
  const tb = Object.fromEntries(research.map(x => [x.key, x]));
  const ends = (key, c) => [tb[key].rows[0].values[c], tb[key].rows[tb[key].rows.length - 1].values[c]].map(local);
  const speed = tb.speed.rows.slice(-2).map(r => local(r.values[0]) + " " + t("ms"));   // 50 a second, before and after
  const sum = c => fmtInt(tb.retrain.rows.reduce((a, r) => a + Number(r.values[c]), 0));
  put("#heads", [["h_recall", ...ends("quality", 0)], ["h_f1", ...ends("quality", 2)], ["h_speed", ...speed],
    ["h_retrain", sum(0), sum(1)]].map(([k, a, b]) =>
    `<div class="head"><span>${t(k)}</span><b>${esc(a)}<em>→</em>${esc(b)}</b></div>`).join(""));
  // Bold: the system now; grey beside it: before, or someone else's model.
  const cls = (x, r) => r.now ? "now" : x.rows.some(o => o.now) ? "was" : "";
  put("#tables", research.map(x => `<div class="rt"><h3>${esc(x.title[lang])}</h3><p>${esc(x.note[lang])}</p>` +
    `<div class="tbl"><table><thead><tr><th></th>${x.head[lang].map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
    x.rows.map(r => `<tr class="${cls(x, r)}"><td>${esc(r.name[lang])}</td>` +
      r.values.map(v => `<td>${esc(local(v))}</td>`).join("") + `</tr>`).join("") + `</tbody></table></div></div>`).join(""));
  const files = [...new Set(research.flatMap(x => x.rows.map(r => r.quote.file)))];
  $("#r-source").textContent = fill(t("source"), {files: files.join(", ")});
}

async function pollRun() {
  if (!story.runId) return;
  const r = await api("/api/episode/" + story.runId);
  if (r.rows) story.run = r;
}

// The run until row k has its final decision: the second look decides once more.
async function settled(k) {
  for (let i = 0; i < 38; i++) {
    await pollRun();
    const row = story.run && story.run.rows[k];
    if (row && row.decision && row.decision !== "SECOND_LOOK") return row;
    renderScene();
    await sleep(400);
  }
  return null;
}

// Step 2: the case's transfers one at a time, until the system holds one.
async function feed() {
  const id = story.runId;
  story.busy = true;
  while (story.step === 2 && story.runId === id) {
    story.note = fill(t("st_sending"), {n: story.sent + 1, total: story.run ? story.run.rows.length : "…"});
    renderStory();
    const r = await api(`/api/episode/${id}/next`, {});
    if (!r.ok) { story.note = r.error || t("st_none"); break; }
    story.sent += 1;
    const row = await settled(story.sent - 1);
    if (!row) { story.note = t("st_no_decision"); break; }
    story.focus = row.id;
    renderScene();
    if (row.decision === "REVIEW") {
      Object.assign(story, {held: row, busy: false, passed: fill(t("st_passed"), {n: story.sent - 1, k: story.sent})});
      return go(3);
    }
    await sleep(1500);
  }
  story.busy = false;
  renderStory();
}

// Step 4: the analyst's block; the case reaches the database a few seconds after the hold.
async function block() {
  story.busy = true;
  renderStory();
  for (let i = 0; i < 20 && !story.blocked; i++) {
    const r = await api(`/api/cases/${encodeURIComponent(story.held.id)}/resolve`, {disposition: "CONFIRMED_FRAUD"});
    if (r.ok) story.blocked = true;
    else { story.note = t("st_case_wait"); renderStory(); await sleep(1000); }
  }
  Object.assign(story, {busy: false, note: story.blocked ? "" : t("st_case_fail")});
  renderStory(); renderFlow();
  refreshCases();
}

// Step 5: the case's next transfer, after the block.
async function follow() {
  Object.assign(story, {busy: true, note: t("st_wait")});
  renderStory();
  const r = await api(`/api/episode/${story.runId}/next`, {});
  if (r.ok) {
    story.sent += 1;
    const row = await settled(story.sent - 1);
    story.note = row ? "" : t("st_no_decision");
    if (row) Object.assign(story, {follow: row, focus: row.id});
  } else story.note = t("st_no_more");
  story.busy = false;
  renderStory(); renderScene();
}

async function go(step) {
  if (story.busy) return;
  Object.assign(story, {step, note: ""});
  if (step === 1 && !status.background.on) await api("/api/background", {on: true});
  if (step === 2) {
    Object.assign(story, {runId: null, run: null, sent: 0, held: null, follow: null, focus: null, blocked: false, passed: ""});
    const r = await api("/api/story", {});
    if (r.id) { story.runId = r.id; await pollRun(); feed(); } else story.note = r.error || "";
  }
  if (step === 5) follow();
  renderStory(); renderScene(); renderFlow();
}

async function openTab(name) {
  tab = name;
  ["live", "research"].forEach(s => $("#" + s).hidden = s !== tab);
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "research" && !research) research = (await api("/api/results")).research;
  renderResearch();
}

async function refreshStatus() {
  try { status = await api("/api/status"); } catch (e) { status = null; }
  if (ready()) {
    const total = Object.values(status.counts || {}).reduce((a, b) => a + b, 0), now = Date.now();
    if (prev && now > prev.at) {
      const r = (total - prev.total) * 1000 / (now - prev.at);
      rate = rate == null ? r : 0.7 * rate + 0.3 * r;
    }
    prev = {total, at: now};
  }
  renderStatus();
  renderStory();
}

async function refreshCases() {
  cases = await api("/api/cases?new=1&limit=1");
  if (ready()) renderKpis();
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-tab],[data-lang],[data-act],[data-focus],#bg");
  if (!el) return;
  if (el.dataset.tab) openTab(el.dataset.tab);
  else if (el.dataset.lang) { lang = el.dataset.lang; try { localStorage.setItem("demo-lang", lang); } catch (err) {} applyLang(); }
  else if (el.dataset.focus) { story.focus = el.dataset.focus; renderScene(); }
  else if (el.id === "bg") { el.disabled = true; await api("/api/background", {on: !status.background.on}); refreshStatus(); }
  else if (el.dataset.act === "block") block();
  else go(Number(el.dataset.act));
});

document.querySelector('[data-tab="live"]').classList.add("on");
applyLang();
refreshStatus().then(() => { if (ready()) refreshCases().catch(() => {}); });
setInterval(refreshStatus, 1000);
setInterval(() => { if (ready() && tab === "live") refreshCases().catch(() => {}); }, 3000);
setInterval(async () => {
  if (!ready() || tab !== "live") return;
  if (story.step >= 2 && story.run) { if (!story.busy) { await pollRun(); renderScene(); renderStory(); } }
  else { ticker = (await api("/api/stream?limit=8")).rows || []; renderScene(); }
}, 1000);
</script>
