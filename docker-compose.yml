name: fraud-detection

# The whole pipeline on one machine: .\run.ps1 up (or docker compose up -d --build).

services:

  # --- Event ingestion ------------------------------------------------------
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT}:29092"        # host clients -> 127.0.0.1:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,SSL:SSL
      # INTERNAL kafka:9092 for containers, EXTERNAL 127.0.0.1:29092 for the host,
      # SSL kafka:9094 for mutual TLS: side by side, so measuring TLS changes a port.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092,SSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092,SSL://kafka:9094
      # The names the image's entrypoint requires: it finds the stores under
      # /etc/kafka/secrets by *_FILENAME and reads their passwords from files there,
      # hence PKCS12 (the clients use PEM).
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      # Mutual TLS: a client without a certificate signed by the CA is refused.
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
      # Made by .\run.ps1 make-certs before the first up.
      - ./infra/kafka/certs:/etc/kafka/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [fraudnet]

  # One-shot: create the topics, then exit.
  kafka-init:
    image: ${KAFKA_IMAGE}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka:/scripts:ro
    restart: "no"
    networks: [fraudnet]

  # --- In-memory feature store ---------------------------------------------
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks: [fraudnet]

  # --- Analytical warehouse + WORM audit ------------------------------------
  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    container_name: clickhouse
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT}:8123"    # HTTP
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT}:9000"  # native protocol
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro   # schema on first boot
    # Healthy once the schema exists, not just the port. Double quotes: in single
    # ones $$CLICKHOUSE_DB would not expand ($$ is compose's escape for $).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client -u "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD"
          -q "SELECT 1 FROM $$CLICKHOUSE_DB.transactions_scored LIMIT 0"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [fraudnet]

  # --- Stream processing (PyFlink session cluster) --------------------------
  jobmanager:
    build:
      context: ./infra/flink
      args:
        FLINK_VERSION: ${FLINK_VERSION}
    image: fraud-flink:${FLINK_VERSION}
    container_name: jobmanager
    command: jobmanager
    ports:
      - "127.0.0.1:${FLINK_UI_PORT}:8081"           # Flink web UI
    environment:
      PAYLOAD_KEY_HEX: ${PAYLOAD_KEY_HEX}
      # PLAINTEXT or SSL; switching needs a resubmit.
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./stream-processor:/opt/flink/usrjobs   # the job's modules
      - flink_checkpoints:/opt/flink/checkpoints
      - ./infra/kafka/certs:/certs:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [fraudnet]

  taskmanager:
    image: fraud-flink:${FLINK_VERSION}
    container_name: taskmanager
    command: taskmanager
    # Back after it dies on its own (it once ran out of Metaspace).
    restart: unless-stopped
    environment:
      # Only enables decryption: records without the envelope are read as they are.
      PAYLOAD_KEY_HEX: ${PAYLOAD_KEY_HEX}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./stream-processor:/opt/flink/usrjobs
      - flink_checkpoints:/opt/flink/checkpoints
      - ./infra/kafka/certs:/certs:ro             # the job's Kafka client runs here
    depends_on:
      - jobmanager
    networks: [fraudnet]

  # --- Dashboards -----------------------------------------------------------
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      # Lets demo/ show the dashboard in a frame; without it Grafana answers
      # X-Frame-Options: deny. Login is still required.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - clickhouse
    networks: [fraudnet]

  # --- Sink writer: transactions.scored -> ClickHouse, a case for each hold ---
  sink-writer:
    build:
      context: .
      dockerfile: infra/sink-writer/Dockerfile
    image: fraud-sink-writer:latest
    container_name: sink-writer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    volumes:
      - ./ml/models:/ml/models:ro              # the model each case is explained by
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [fraudnet]
    restart: unless-stopped

  # TabPFN decides the transfers just under the cut-off (second-look/README.md); its
  # weights are fetched by hand, named by TABPFN_CHECKPOINT in .env.
  second-look:
    build:
      context: .
      dockerfile: infra/second-look/Dockerfile
    image: fraud-second-look:latest
    container_name: second-look
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      # Two sleeping threads: torch's spinning default fought the stream for the
      # cores, and answers took 6 to 20 s.
      OMP_NUM_THREADS: "2"
      OMP_WAIT_POLICY: PASSIVE
    volumes:
      - ./ml/models:/models:ro
      - ${TABPFN_CHECKPOINT:-./second-look}:/tabpfn/checkpoint.safetensors:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [fraudnet]
    restart: unless-stopped

  # Retrains the model daily on the logged decisions and the verdicts (ml/retrain.py);
  # a person promotes a better one (run.ps1 promote-model).
  retrainer:
    build:
      context: .
      dockerfile: infra/ml/Dockerfile
    image: fraud-ml:latest
    container_name: retrainer
    command: ["python", "retrain.py", "--cache", "models_matrix.npz",
              "--every-hours", "${RETRAIN_EVERY_HOURS:-24}"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/repo
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [fraudnet]
    restart: unless-stopped

  # The demo page (demo/README.md).
  demo:
    build:
      context: .
      dockerfile: infra/demo/Dockerfile
    image: fraud-demo:latest
    container_name: demo
    ports:
      # Loopback only: the page can send transfers and close cases.
      - "127.0.0.1:${DEMO_PORT:-8090}:8090"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      FLINK_REST: http://jobmanager:8081
      GRAFANA_PORT: ${GRAFANA_PORT}
    volumes:
      - ./demo:/repo/demo:ro
      - ./data-generator:/repo/data-generator:ro
      # The generator encrypts with the job's payload_crypto.py.
      - ./stream-processor:/repo/stream-processor:ro
      - ./sink-writer:/repo/sink-writer:ro
      - ./ml/models:/repo/ml/models:ro
      - ./infra/grafana/provisioning/dashboards/json:/repo/infra/grafana/provisioning/dashboards/json:ro
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [fraudnet]
    restart: unless-stopped

networks:
  fraudnet:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  clickhouse_data:
  grafana_data:
  # Outlives the containers, so a resubmitted job resumes instead of rescoring.
  flink_checkpoints:

